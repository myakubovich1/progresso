<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f7f8f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #24352b;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
      "
    >
      <p style="font-size: 24px; font-weight: bold">progresso ↗</p>
      <h1 style="font-size: 26px; line-height: 1.3">Your next step starts here.</h1>
      <p style="line-height: 1.7">
        Confirm your email to create your personal space and start making progress.
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email"
          style="
            display: inline-block;
            background: #24352b;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
          "
          >Confirm my email</a
        >
      </p>
      <p style="font-size: 13px; line-height: 1.7; color: #5c695f">
        This link can be used once. If you did not create a Progresso account, you can ignore this
        email.
      </p>
    </div>
  </body>
</html>
